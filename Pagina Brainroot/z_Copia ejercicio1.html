<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mi primer ejercicio</title>
  <link rel="icon" type="image/jpeg" href="willyrexicono.jpeg" />

  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: linear-gradient(270deg, 
        #ff00ff, #00ffff, #00ff00, #ffff00, #ff0000, #0000ff, #ff00ff
      );
      background-size: 1400% 1400%;
      animation: fondoNeon 15s ease infinite;
      font-family: Arial, sans-serif;
    }

    @keyframes fondoNeon {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    a {
      color: #ff00ff;
      font-weight: bold;
      font-size: 1.2em;
      text-shadow: 
        0 0 5px #ff00ff,
        0 0 10px #ff00ff,
        0 0 20px #ff00ff,
        0 0 30px #ff00ff;
      animation: parpadeo 1.2s infinite alternate;
      text-decoration: none;
      transition: transform 0.2s ease;
    }

    a:hover {
      transform: scale(1.1);
      text-shadow: 
        0 0 10px #ff66ff,
        0 0 20px #ff66ff,
        0 0 40px #ff66ff,
        0 0 80px #ff66ff;
    }

    @keyframes parpadeo {
      from { opacity: 1; text-shadow: 0 0 5px #ff00ff, 0 0 15px #ff00ff, 0 0 25px #ff00ff; }
      to { opacity: 0.7; text-shadow: 0 0 2px #ff00ff, 0 0 6px #ff00ff, 0 0 10px #ff00ff; }
    }

    h1, h2, h3, h4, h5, h6, li {
      color: #ffffff;
      text-shadow: 0 0 5px #fff, 0 0 10px #0ff, 0 0 20px #0ff;
    }

    nav ul, nav ol {
      list-style: none;
      padding: 0;
    }

    #dvd {
      position: absolute;
      width: 200px;
      filter: drop-shadow(0 0 15px white);
      transition: filter 0.3s linear;
      will-change: transform, left, top;
    }

    #toggleBtn {
      position: fixed;
      top: 10px;
      right: 10px;
      padding: 10px 20px;
      font-size: 16px;
      background: #ff00ff;
      border: none;
      border-radius: 12px;
      color: white;
      cursor: pointer;
      font-weight: bold;
      text-shadow: 0 0 5px black;
      box-shadow: 0 0 10px #ff00ff;
      z-index: 1000;
    }

    #toggleBtn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 20px #fff;
    }

    /* Video fijo centrado abajo (vertical) */
    #videoContainer {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 500;
    }

    #videoContainer video {
      width: 250px;       /* ancho reducido */
      height: 450px;      /* más alto → vertical */
      object-fit: cover;  /* recorta para llenar */
      border: 3px solid #fff;
      border-radius: 12px;
      box-shadow: 0 0 20px #ff00ff;
      /*pointer-events: none; /* no clicable, como si fuera foto */
    }
  </style>
</head>
<body>

  <button id="toggleBtn">Modo: DVD</button>

  <header>
    <nav>
      <ul>
        <li><a href="https://www.youtube.com/user/Willyrex">Willyrex</a></li>
        <li><a href="https://www.youtube.com/watch?v=04YL5pxP5WU">Donpollo</a></li>
        <li><a href="https://www.youtube.com/shorts/-r2Z9ZFFork">Sigma</a></li>
      </ul>
    </nav>

    <nav>
      <ol>
        <li><a href="http://127.0.0.1:5500/Ejercicio%201.html">Skibidi</a></li>
        <li>Gooner</li>
        <li>rata</li>
      </ol>
    </nav>
  </header>

  <h1>Hola mundo</h1>
  <h2>Hola mundo</h2>
  <h3>Hola mundo</h3>
  <h4>Hola mundo</h4>
  <h5>Hola mundo</h5>
  <h6>Hola mundo</h6>

  <img id="dvd" src="willyrexicono.jpeg" alt="Willyrex" />

  <!-- Video vertical fijo en el centro abajo -->
  <div id="videoContainer">
    <video src="video SS.mp4" autoplay loop controls></video>

    <audio controls autoplay loop src="WAITWAITWAIT WHAT DA HELLLLL WAAZZZAAAA (quest ah dog sound effect) - John_YouTube.mp3"></audio>

<iframe width="560" height="315" src="https://www.youtube.com/embed/2-qyUSTYtcs?si=ohMDcVui8UByiwOo" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
  <script>
    const dvd = document.getElementById("dvd");
    const toggleBtn = document.getElementById("toggleBtn");

    let mode = "dvd"; // "dvd" o "cursor"
    let x = 100, y = 100;
    let dx = 3, dy = 2;
    let scale = 1;
    let growing = true;

    const colors = ["red", "lime", "yellow", "cyan", "magenta", "white", "blue", "orange"];

    function cambiarColor() {
      const color = colors[Math.floor(Math.random() * colors.length)];
      dvd.style.filter = `drop-shadow(0 0 15px ${color})`;
    }

    function moverDVD() {
      const anchoPantalla = window.innerWidth;
      const altoPantalla = window.innerHeight;
      const anchoImg = dvd.offsetWidth;
      const altoImg = dvd.offsetHeight;

      x += dx;
      y += dy;

      if (x <= 0 || x + anchoImg >= anchoPantalla) {
        dx *= -1;
        cambiarColor();
      }
      if (y <= 0 || y + altoImg >= altoPantalla) {
        dy *= -1;
        cambiarColor();
      }

      if (growing) {
        scale += 0.01;
        if (scale >= 1.3) growing = false;
      } else {
        scale -= 0.01;
        if (scale <= 0.8) growing = true;
      }

      dvd.style.left = x + "px";
      dvd.style.top = y + "px";
      dvd.style.transform = `scale(${scale})`;
    }

    let mouseX = 0, mouseY = 0;
    document.addEventListener("mousemove", e => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    function moverCursor() {
      x += (mouseX - x - dvd.offsetWidth / 2) * 0.01;
      y += (mouseY - y - dvd.offsetHeight / 2) * 0.01;
      dvd.style.left = x + "px";
      dvd.style.top = y + "px";

      if (growing) {
        scale += 0.01;
        if (scale >= 1.3) growing = false;
      } else {
        scale -= 0.01;
        if (scale <= 0.8) growing = true;
      }

      dvd.style.transform = `scale(${scale})`;
    }

    function animar() {
      if (mode === "dvd") {
        moverDVD();
      } else {
        moverCursor();
      }
      requestAnimationFrame(animar);
    }
    animar();

    toggleBtn.addEventListener("click", () => {
      mode = mode === "dvd" ? "cursor" : "dvd";
      toggleBtn.textContent = "Modo: " + (mode === "dvd" ? "DVD" : "Cursor");
    });
  </script>
</body>
</html>
